<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMBRA: Protocol Zero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" width="960" height="640"></canvas>

  <div id="subtitle-box">
    <div id="subtitle-text"></div>
  </div>

  <div id="objective-box">
    <div id="objective-label">OBJECTIVE</div>
    <div id="objective-text"></div>
  </div>

  <div id="hud">
    <div class="hud-item">FLOOR <span id="hud-floor">—</span></div>
    <div class="hud-item">VIS <span id="hud-vis">0%</span></div>
    <div class="hud-item">SHADOW <span id="hud-shadow">100%</span></div>
    <div class="hud-item">ALERT <span id="hud-alert">0%</span></div>
    <div class="hud-item">STATE <span id="hud-status">—</span></div>
    <div class="hud-item">LURE <span id="hud-lure">—</span></div>
    <div class="hud-item">JAM [F] <span id="hud-cells">—</span></div>
    <div class="hud-item">RECORDS <span id="hud-archive">—</span></div>
    <button id="journal-open" class="hud-item" hidden>ARCHIVE [J]</button>
  </div>

  <div id="game-actions">
    <div id="title-panel"><p class="eyebrow">FACILITY  //  CLASSIFIED</p><h1>UMBRA<span>PROTOCOL ZERO</span></h1><p>Wake up. Stay unseen. Reach the surface.</p><p class="keys-hint">WASD / ARROWS · C HIDE · E INTERACT · Q LURE</p></div>
    <button id="start-game">Begin protocol</button>
    <button id="restart-game" hidden>Restart protocol</button>
  </div>
  <section id="journal" role="dialog" aria-modal="true" aria-labelledby="journal-title" hidden>
    <div class="journal-inner"><h2 id="journal-title">RECOVERED ARCHIVE</h2><p>Collect four records to transmit evidence at the surface.</p><div id="journal-entries"></div><button id="journal-close">Resume [J / Esc]</button></div>
  </section>
  <div id="vignette"></div>
  <div id="scanlines" aria-hidden="true"></div>
  <div id="blur-overlay"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
